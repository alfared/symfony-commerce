doctrine:
    dbal:
        url: "%env(resolve:DATABASE_URL)%"
        types:
            attribute_id: App\Catalog\Attribute\Infrastructure\Doctrine\Type\AttributeIdType
            attribute_code: App\Catalog\Attribute\Infrastructure\Doctrine\Type\AttributeCodeType
            attribute_name: App\Catalog\Attribute\Infrastructure\Doctrine\Type\AttributeNameType
            manufacturer_id: App\Catalog\Manufacturer\Infrastructure\Doctrine\Type\ManufacturerIdType
            manufacturer_code: App\Catalog\Manufacturer\Infrastructure\Doctrine\Type\ManufacturerCodeType
            manufacturer_name: App\Catalog\Manufacturer\Infrastructure\Doctrine\Type\ManufacturerNameType
            manufacturer_slug: App\Catalog\Manufacturer\Infrastructure\Doctrine\Type\ManufacturerSlugType
        profiling_collect_backtrace: "%kernel.debug%"
    orm:
        auto_mapping: false
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        validate_xml_mapping: true
        mappings:
            Product:
                is_bundle: false
                type: attribute
                dir: "%kernel.project_dir%/src/Catalog/Product/Domain/Model"
                prefix: 'App\Catalog\Product\Domain\Model'
                alias: Product

            ProductVariant:
                is_bundle: false
                type: attribute
                dir: "%kernel.project_dir%/src/Catalog/ProductVariant/Domain/Model"
                prefix: 'App\Catalog\ProductVariant\Domain\Model'
                alias: ProductVariant

            ProductOption:
                is_bundle: false
                type: attribute
                dir: "%kernel.project_dir%/src/Catalog/ProductOption/Domain/Model"
                prefix: 'App\Catalog\ProductOption\Domain\Model'
                alias: ProductOption

            Category:
                is_bundle: false
                type: attribute
                dir: "%kernel.project_dir%/src/Catalog/Category/Domain/Model"
                prefix: 'App\Catalog\Category\Domain\Model'
                alias: Category

            Attribute:
                type: attribute
                is_bundle: false
                dir: "%kernel.project_dir%/src/Catalog/Attribute/Domain"
                prefix: 'App\Catalog\Attribute\Domain'
                alias: Attribute
            Manufacturer:
                type: attribute
                is_bundle: false
                dir: "%kernel.project_dir%/src/Catalog/Manufacturer/Domain"
                prefix: 'App\Catalog\Manufacturer\Domain'
                alias: Manufacturer

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: "_test%env(default::TEST_TOKEN)%"

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
