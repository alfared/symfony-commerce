parameters:
    commerce.backend_dir: '%kernel.project_dir%'
    commerce.frontend_dir: '/var/www/frontend'
services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
    App\Catalog\Product\Domain\Factory\ProductFactoryInterface:
        alias: App\Catalog\Product\Domain\Factory\ProductFactory

    App\Catalog\ProductVariant\Domain\Factory\ProductVariantFactoryInterface:
        alias: App\Catalog\ProductVariant\Domain\Factory\ProductVariantFactory
    
    App\Catalog\Product\Domain\Repository\ProductRepositoryInterface:
        alias: App\Catalog\Product\Infrastructure\Doctrine\ProductRepository
    
    App\Catalog\ProductOption\Domain\Factory\ProductOptionFactoryInterface:
        alias: App\Catalog\ProductOption\Domain\Factory\ProductOptionFactory
    
    App\Catalog\Category\Domain\Repository\CategoryRepositoryInterface:
        alias: App\Catalog\Category\Infrastructure\Doctrine\CategoryRepository
    
    App\Catalog\ProductVariant\Domain\Repository\ProductVariantRepositoryInterface:
        alias: App\Catalog\ProductVariant\Infrastructure\Doctrine\ProductVariantRepository
    
    App\Catalog\Brand\Domain\Repository\BrandRepositoryInterface:
        alias: App\Catalog\Brand\Infrastructure\Doctrine\BrandRepository

    App\Catalog\Category\Infrastructure\Api\UpdateCategoryAction:
        tags: ['controller.service_arguments']

    App\Shared\Infrastructure\Symfony\Command\MakeAgentModuleCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
        tags: ['console.command']
    
    App\Shared\Infrastructure\Symfony\Command\MakeCommerceModuleCommand:
        arguments:
            $backendDir: '%commerce.backend_dir%'
            $frontendDir: '%commerce.frontend_dir%'
        tags: ['console.command']


