name: Deploy Production

on:
  push:
    branches:
      - "release/*"

permissions:
  id-token: write
  contents: read
  
jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: Production
      acr-name: symfonycommerceprodacr
      acr-login-server: symfonycommerceprodacr.azurecr.io
      resource-group: symfony-commerce-prod-rg
      api-app-name: symfony-commerce-prod-api
      frontend-app-name: symfony-commerce-prod-frontend
      api-url: https://placeholder/api
      image-tag-prefix: prod
    secrets: inherit
